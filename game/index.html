<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VICE HORIZON — A neon city. A clean slate.</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101c25; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Vice Horizon: open-world driving and crime game. Enter to start, WASD move, F enter car, mouse aim, Space fire, H help."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
