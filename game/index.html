<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#080b17">
  <title>VICE HORIZON</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #080b17; }
    body { font-family: Arial, Helvetica, sans-serif; }
    #shell { position: fixed; inset: 0; background: #080b17; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
    #legend { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); padding: 8px 16px; border: 1px solid rgba(109,236,255,.45); background: rgba(7,12,28,.78); color: #d8f5ff; letter-spacing: .08em; font-size: 11px; text-transform: uppercase; white-space: nowrap; box-shadow: 0 0 24px rgba(0,221,255,.12); }
    #legend b { color: #ffdc64; }
    .scan { position: fixed; inset: 0; pointer-events: none; opacity: .08; background: repeating-linear-gradient(to bottom, transparent 0, transparent 3px, #fff 4px, transparent 5px); }
  </style>
</head>
<body>
  <main id="shell"><canvas id="game" aria-label="Vice Horizon game canvas"></canvas></main>
  <div class="scan"></div>
  <div id="legend"><b>WASD</b> move <b>F</b> carjack <b>SPACE</b> fire <b>SHIFT</b> sprint <b>P</b> pause <b>H</b> help</div>
  <script type="module">
    const canvas = document.querySelector('#game');
    const resize = () => { const scale = Math.min(1.5, devicePixelRatio || 1); canvas.width = Math.max(1, Math.floor(innerWidth * scale)); canvas.height = Math.max(1, Math.floor(innerHeight * scale)); canvas.style.width = `${innerWidth}px`; canvas.style.height = `${innerHeight}px`; };
    addEventListener('resize', resize, { passive: true }); resize();
    import('./src/main.js').then(({ boot }) => boot(canvas)).catch(error => { console.error('Vice Horizon failed to boot', error); document.querySelector('#legend').textContent = 'GAME UNAVAILABLE'; });
  </script>
</body>
</html>
