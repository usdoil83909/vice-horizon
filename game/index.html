<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#080b17">
  <title>Pearl City: An Open-World Crime Story</title>
  <style>
    :root { color-scheme: dark }
    * { box-sizing: border-box }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #080b17 }
    body { font-family: Arial, Helvetica, sans-serif }
    #shell { position: fixed; inset: 0; background: #080b17 }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none }
    #legend { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); padding: 8px 16px; border: 1px solid rgba(109,236,255,.45); background: rgba(7,12,28,.78); color: #d8f5ff; letter-spacing: .08em; font-size: 11px; text-transform: uppercase; white-space: nowrap; box-shadow: 0 0 24px rgba(0,221,255,.12) }
    #legend b { color: #ffdc64 }
    .scan { position: fixed; inset: 0; pointer-events: none; opacity: .08; background: repeating-linear-gradient(to bottom, transparent 0, transparent 3px, #fff 4px, transparent 5px) }
  </style>
</head>
<body>
  <main id="shell"><canvas id="game" aria-label="Pearl City game canvas"></canvas></main>
  <div class="scan"></div>
  <div id="legend"><b>WASD</b> move <b>F</b> carjack <b>SPACE</b> fire <b>SHIFT</b> sprint <b>P</b> pause <b>H</b> help</div>
  <script type="module">
    const canvas = document.getElementById('game');
    function fitScreen() {
      const ratio = Math.min(1.5, window.devicePixelRatio || 1);
      canvas.width = Math.max(1, Math.floor(innerWidth * ratio));
      canvas.height = Math.max(1, Math.floor(innerHeight * ratio));
      Object.assign(canvas.style, { width: `${innerWidth}px`, height: `${innerHeight}px` });
    }
    window.addEventListener('resize', fitScreen, { passive: true });
    fitScreen();
    import('./src/main.js').then(module => module.boot(canvas)).catch(error => {
      console.error('Pearl City could not start', error);
      document.getElementById('legend').textContent = 'GAME UNAVAILABLE';
    });
  </script>
</body>
</html>
